version: 2

sources:
  - name: lake
    description: "Data lake : une ligne par changement capturé dans MOSIP (connecteur lake-prereg)."
    schema: lake
    tables:
      - name: mosip_prereg_applicant_demographic
        description: "Tous les changements de prereg.applicant_demographic, jamais modifiés."
        loaded_at_field: "to_timestamp(__source_ts_ms / 1000.0)"
        freshness:
          warn_after: {count: 6, period: hour}
          error_after: {count: 24, period: hour}
      - name: mosip_regprc_rid_uin_link
        description: >
          Tous les changements de regprc.rid_uin_link (connecteurs mosip-regprc-cdc et lake-regprc-rid-uin-link),
          jamais modifiés : id, reg_id (RID), reg_type, entry_date. Jamais uin ni civil_registry_number.
      - name: mosip_prereg_enrichissement
        description: "Réponses de l'API de pré-inscription (connecteur lake-enrichissement) : champs extraits seulement."
      - name: mosip_master_location
        description: "Tous les changements de master.location (connecteurs mosip-master-cdc et lake-master)."
      - name: mosip_master_registration_center
        description: "Tous les changements de master.registration_center, sans contacts ni adresses."
      - name: mosip_master_dynamic_field
        description: "Tous les changements de master.dynamic_field : listes de valeurs (nationalité, genre…) et libellés."

  - name: ods
    description: "Opérationnel : état courant des tables MOSIP, une ligne par clé, mis à jour sur place (connecteurs ods-*)."
    schema: ods
    tables:
      - name: regprc_registration
        description: >
          État courant de regprc.registration (connecteur ods-regprc-registration) : une ligne par inscription (RID).
          __kafka_offset = offset du dernier message écrit, pour les modèles incrémentaux.
        loaded_at_field: "to_timestamp(__source_ts_ms / 1000.0)"
        freshness:
          warn_after: {count: 2, period: hour}
          error_after: {count: 24, period: hour}
      - name: regprc_rid_uin_link
        description: "État courant de regprc.rid_uin_link : lien inscription → NIU, sans le NIU (entry_date = date du NIU)."
      - name: regprc_registration_list
        description: "État courant de regprc.registration_list : synchronisations des paquets, décision du poste."
