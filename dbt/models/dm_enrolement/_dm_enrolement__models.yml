version: 2

models:
  - name: fait_enrolement_jour
    description: "Contrat bi.fait_enrolement_jour : paquets reçus par jour de réception, centre et type (cohorte, I4)."
    columns:
      - name: jour
        data_tests:
          - not_null
      - name: code_centre
        data_tests:
          - not_null
      - name: type_demande
        data_tests:
          - not_null
      - name: inscriptions
        data_tests:
          - not_null

  - name: fait_niu_jour
    description: "Contrat bi.fait_niu_jour : NIU par jour de génération (rid_uin_link.entry_date), centre et type."
    columns:
      - name: jour
        data_tests:
          - not_null
      - name: code_centre
        data_tests:
          - not_null

  - name: fait_niu_profil_jour
    description: >
      Profil des NIU (lot 6) : NIU par jour de génération, région du centre, sexe, tranche d'âge et nationalité.
      Publié en bi.fait_niu_profil_jour et bi.fait_niu_nationalite_jour ; même total que fait_niu_jour, jour par jour
      (test assert_enrolement_profil_niu_egal_niu).
    columns:
      - name: jour
        data_tests:
          - not_null
      - name: sexe
        data_tests:
          - accepted_values:
              arguments:
                values: ['F', 'H', 'I']
      - name: nationalite
        data_tests:
          - not_null

  - name: fait_arret_etape_jour
    description: "Rejets et échecs par jour de réception, centre, type et étape (I5, I6)."
    columns:
      - name: devenir
        data_tests:
          - accepted_values:
              arguments:
                values: ['rejete', 'echoue']

  - name: stock_en_cours
    description: "Paquets en cours par centre, étape et ancienneté de la dernière transaction (I7)."
    columns:
      - name: anciennete
        data_tests:
          - accepted_values:
              arguments:
                values: ['moins_7j', '7_30j', 'plus_30j']

  - name: fait_arret_motif_jour
    description: "Rejets et échecs par jour de réception, centre, type, étape (reg_stage_name) et motif (status_comment)."
    columns:
      - name: devenir
        data_tests:
          - accepted_values:
              arguments:
                values: ['rejete', 'echoue']

  - name: stock_en_cours_motif
    description: "Paquets en cours par centre, étape (reg_stage_name), motif (status_comment) et ancienneté."
    columns:
      - name: anciennete
        data_tests:
          - accepted_values:
              arguments:
                values: ['moins_7j', '7_30j', 'plus_30j']

  - name: fait_delai_jour
    description: "Histogrammes des délais réception → NIU et enrôlement → réception (I8, I9)."
    columns:
      - name: mesure
        data_tests:
          - accepted_values:
              arguments:
                values: ['reception_niu', 'enrolement_reception']
      - name: classe_h
        data_tests:
          - not_null

  - name: stock_synchro_non_recue
    description: "Paquets synchronisés non reçus par centre et ancienneté (I10)."

  - name: suivi_dossier
    description: >-
      Source de bi.suivi_dossier : une ligne par RID ; le RID est remplacé par son empreinte à la publication. Vue sur
      suivi_inscription (rid unique par index) jointe aux libellés d'étape (code unique, test du seed) et au motif
      (motif_inscription, rid unique par index) : pas de test d'unicité ici, il relisait toute la table à chaque
      passage (12 s).

  - name: ref_motif
    description: >-
      Source de bi.ref_motif : catalogue des motifs (code, libellé, message type de MOSIP, piste), sans les règles ;
      motif unique (test du seed).

  - name: fraicheur_enrolement
    description: "Bornes des données publiées dans bi.source_fraicheur (une ligne ; nulles tant que rien n'est reçu)."
