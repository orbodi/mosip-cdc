version: 2

models:
  - name: dim_date
    description: "Axe du temps : un jour par ligne."
    columns:
      - name: date_key
        description: "Jour au format AAAAMMJJ."
        data_tests:
          - unique
          - not_null

  - name: dim_statut
    description: "Libellés et ordre d'affichage des statuts MOSIP."
    columns:
      - name: status_code
        data_tests:
          - unique
          - not_null

  - name: dim_zone
    description: "Territoire publié dans bi.zone : de la région au centre d'enrôlement."
    columns:
      - name: code
        data_tests:
          - unique
          - not_null
      - name: niveau
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['region', 'prefecture', 'commune', 'canton', 'localite', 'centre']
      - name: nom
        data_tests:
          - not_null
      - name: parent_code
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: code
              config:
                where: "parent_code <> 'HORS_REFERENTIEL'"

  - name: dim_centre_region
    description: "Région de chaque centre d'enrôlement (remontée de dim_zone) ; code_centre unique par index."
    columns:
      - name: code_region
        data_tests:
          - not_null
