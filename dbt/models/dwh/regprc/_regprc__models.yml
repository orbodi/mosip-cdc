version: 2

# Unicité : pas de test « unique » là où la base la garantit déjà. Un tel test relit toute la table à chaque passage
# (10 à 27 s chacun le 25/10/2026) sans pouvoir échouer :
# - rid de stg_regprc__registration et synchronisation_id de stg_regprc__registration_list : clés primaires de l'ODS
#   (sql/traitement/14_ods_regprc.sql) ;
# - rid de stg_regprc__rid_uin_link (rien ne l'impose dans l'ODS) et rid de suivi_inscription : index unique de
#   dwh.suivi_inscription. Un deuxième lien pour un même RID fait échouer le modèle suivi_inscription (« duplicate key
#   value violates unique constraint »), donc la publication : voir docs/enrolement.md, Exploitation.

models:
  - name: stg_regprc__registration
    description: "État courant de regprc.registration (ODS) : une ligne par inscription reçue (clé primaire : rid)."
    columns:
      - name: recu_le
        data_tests:
          - not_null

  - name: stg_regprc__rid_uin_link
    description: "Lien inscription → NIU (ODS), sans le NIU : une ligne par RID (garanti par l'index unique de suivi_inscription)."
    columns:
      - name: niu_le
        data_tests:
          - not_null

  - name: stg_regprc__registration_list
    description: "Synchronisations des paquets (ODS) : une ligne par synchronisation (clé primaire : synchronisation_id)."

  - name: stg_regprc__enrichissement
    description: >
      Dernière réponse de l'ID Repository par inscription qui a un NIU (lake, lot 6) : genre, sexe (F, H, I),
      nationalité, année et mois de naissance ; rid unique par index. Pas de test sur ses 6 M de lignes : sexe vaut
      F, H ou I par construction ; les genres inconnus sont signalés par assert_enrolement_genres_inconnus.

  - name: suivi_inscription
    description: "Table pivot : une ligne par RID reçu ou synchronisé, jalons, étape et devenir (règle I4) ; rid unique par index."
    columns:
      - name: rid
        data_tests:
          - not_null
      - name: code_centre
        description: "Cinq premiers chiffres du RID (décision C) ; un code absent du référentiel lève une alerte."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: code
              config:
                severity: warn
      - name: devenir
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['niu', 'en_cours', 'echoue', 'rejete', 'non_classe', 'non_recu']
          - accepted_values:
              arguments:
                values: ['niu', 'en_cours', 'echoue', 'rejete', 'non_recu']
              config:
                severity: warn
      - name: status_code
        description: "Statut MOSIP ; un code absent de ref_regprc_statuts compte en non_classe (alerte)."
        data_tests:
          - relationships:
              arguments:
                to: ref('ref_regprc_statuts')
                field: status_code
              config:
                severity: warn
                where: "devenir <> 'niu'"
      - name: etape
        description: "Étape d'arrêt ou de présence ; un code absent de ref_regprc_etapes s'affiche sous son code (alerte)."
        data_tests:
          - relationships:
              arguments:
                to: ref('ref_regprc_etapes')
                field: code
              config:
                severity: warn
      - name: enrole_le
        description: "Horodatage du RID ; nul si les 14 derniers chiffres ne sont pas une date (alerte)."
        data_tests:
          - not_null:
              config:
                severity: warn

  - name: motif_inscription
    description: >-
      Étape (reg_stage_name) et motif (status_comment rangé par seeds/ref_regprc_motifs.csv) des inscriptions rejetées,
      échouées ou en cours ; rid unique par index. Le texte du commentaire n'y est pas.
    columns:
      - name: stage
        description: "Étape de traitement ; une étape absente de ref_regprc_stages lève une alerte (libellé = son nom)."
        data_tests:
          - relationships:
              arguments:
                to: ref('ref_regprc_stages')
                field: stage
              config:
                severity: warn
                where: "stage <> 'INCONNUE'"
