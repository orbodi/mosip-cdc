version: 2

# Correspondances de codes MOSIP. Un code en double dupliquerait des lignes de suivi_inscription (statuts) ou de
# suivi_dossier (étapes) : contrôle bloquant, rapide (quelques dizaines de lignes).
seeds:
  - name: ref_regprc_statuts
    columns:
      - name: status_code
        data_tests:
          - unique
          - not_null

  - name: ref_regprc_etapes
    columns:
      - name: code
        data_tests:
          - unique
          - not_null

  # Motifs de status_comment (docs/releve-enrolement.md, étape 7) : regle = expression régulière POSIX, sans
  # distinction de casse ; la règle de plus petite priorité gagne ; AUTRE (sans règle) = message non répertorié.
  # libelle : traduction fidèle du message de MOSIP ; piste : ce qu'il faut vérifier (décision du 28/10/2026).
  - name: ref_regprc_motifs
    columns:
      - name: motif
        data_tests:
          - unique
          - not_null
      - name: priorite
        data_tests:
          - unique
          - not_null

  # Étapes de traitement (reg_stage_name) : libellé français et ordre du traitement.
  - name: ref_regprc_stages
    columns:
      - name: stage
        data_tests:
          - unique
          - not_null

  # Impression des cartes (lot 8, docs/releve-impression.md) : statut de la commande (prc_status), mode de remise
  # (delivery_mode) et motif d'annulation (reason_code de l'événement NEW-PRINT-CANCELED). Un code absent compte en
  # « non classée », mode « autre » ou motif « NON_REPERTORIE », jamais deviné.
  - name: ref_impression_statuts
    columns:
      - name: prc_status
        data_tests:
          - unique
          - not_null
      - name: statut
        data_tests:
          - accepted_values:
              arguments:
                values: ['en_attente', 'envoyee', 'rejetee']

  - name: ref_impression_modes_remise
    columns:
      - name: delivery_mode
        data_tests:
          - unique
          - not_null
      - name: mode
        data_tests:
          - accepted_values:
              arguments:
                values: ['hors_ligne', 'en_ligne', 'support']

  - name: ref_impression_motifs_annulation
    columns:
      - name: reason_code
        data_tests:
          - unique
          - not_null

  # Ordre du nord au sud des régions et des préfectures (rang parmi les zones de même parent), calculé le 03/11/2026
  # sur les contours de la carte (frontend/src/composants/carte/contoursTogo.ts) ; nom_mosip : rappel lisible du nom.
  - name: ref_zone_ordre
    columns:
      - name: code
        data_tests:
          - unique
          - not_null
      - name: ordre
        data_tests:
          - not_null

  # Authentifications (lot 9, relevé du 03/11/2026 : docs/releve-authentification.md)
  - name: ref_ida_appelants
    columns:
      - name: requested_entity_id
        data_tests:
          - unique
          - not_null
      - name: perimetre
        data_tests:
          - accepted_values:
              arguments:
                values: ['usagers', 'paquets']
      - name: canal
        data_tests:
          - accepted_values:
              arguments:
                values: ['partenaire', 'portail', 'ussd', 'paquets']

  - name: ref_ida_modalites
    columns:
      - name: code
        data_tests:
          - unique
          - not_null
      - name: famille
        data_tests:
          - accepted_values:
              arguments:
                values: ['biometrique', 'otp', 'demographique', 'usage', 'demande_otp']

  - name: ref_ida_motifs
    columns:
      - name: motif
        data_tests:
          - unique
          - not_null
      - name: priorite
        data_tests:
          - unique
          - not_null
