name: mosip_bi
version: "1.0.0"
config-version: 2
profile: mosip_bi

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
clean-targets: ["target", "dbt_packages"]

vars:
  # Listes de valeurs de master.dynamic_field lues par stg_master__dynamic_field_valeurs
  champs_dynamiques: ['gender', 'nationality', 'nationality-code']

models:
  mosip_bi:
    dwh:
      +schema: dwh
      +materialized: table
      dimensions:
        +grants: {select: ['publisher_ro']}
    dm_preinscription:
      +schema: dm_preinscription
      +materialized: table
      ind_preinscription_jour:
        +grants: {select: ['publisher_ro']}
      fait_preinscription_jour:
        +grants: {select: ['publisher_ro']}
      fraicheur_preinscription:
        +grants: {select: ['publisher_ro']}
      fait_preinscription_profil_jour:
        +grants: {select: ['publisher_ro']}
      fait_preinscription_zone_jour:
        +grants: {select: ['publisher_ro']}
    dm_enrolement:
      +schema: dm_enrolement
      +materialized: table
      +grants: {select: ['publisher_ro']}
      # Usage du schéma pour la publication : donné par dbt, dès sa création (sans script à lancer à part), et seulement
      # s'il manque. Un GRANT sur le schéma réécrit sa ligne du catalogue même quand le droit existe déjà : lancé par
      # plusieurs modèles construits en parallèle, il échouait (« tuple concurrently updated », 30/10/2026), et un seul
      # modèle en échec bloque toute la publication.
      +post-hook: >-
        do $$ begin
          if not has_schema_privilege('publisher_ro', '{{ this.schema }}', 'USAGE') then
            execute 'grant usage on schema {{ this.schema }} to publisher_ro';
          end if;
        end $$

seeds:
  mosip_bi:
    +schema: dwh
    ref_zone_corrections:
      +column_types: {code: text, parent_code: text, masquer: boolean, motif: text}
    ref_regprc_statuts:
      +column_types: {status_code: text, libelle: text, devenir_sans_niu: text}
    ref_regprc_etapes:
      +column_types: {code: text, libelle: text, ordre: integer}
    ref_regprc_motifs:
      +column_types: {motif: text, libelle: text, commentaire: text, regle: text, priorite: integer, piste: text}
    ref_regprc_stages:
      +column_types: {stage: text, libelle: text, ordre: integer}
