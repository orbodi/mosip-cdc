# Connecteur Kafka de Spark, téléchargé au premier démarrage puis gardé dans le volume ivy
spark.jars.packages            org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.2
spark.jars.ivy                 /opt/spark/ivy
spark.sql.session.timeZone     UTC
# Petits volumes : 2 partitions au lieu de 200 pour chaque regroupement
spark.sql.shuffle.partitions   2
spark.ui.enabled               false
